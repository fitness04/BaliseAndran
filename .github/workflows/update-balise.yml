name: Balise Andran

permissions:
  contents: write

on:

  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:

  balise:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: |
          pip install requests

      - name: Install Piper
        run: |
          pip install piper-tts

            - name: Test Piper
        run: |
          piper --help

      - name: Generate bulletin
        run: |
          python scripts/balise_andran.py

      - name: Commit updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Update bulletin" || exit 0

          git push
