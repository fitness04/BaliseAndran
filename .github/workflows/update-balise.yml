name: Balise Andran

on:

  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test
        run: |
          python --version
          date

      - name: Create file
        run: |
          echo "Balise Andran OK" > test.txt

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add test.txt
          git commit -m "Test workflow" || true
          git push
