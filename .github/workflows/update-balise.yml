name: Balise Andran

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: balise-andran
  cancel-in-progress: false

jobs:
  balise:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Télécharger la voix Piper
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p models
          gh release download Voix-Piper-Andran \
            --pattern "model.onnx" \
            --pattern "model.onnx.json" \
            --dir models \
            --clobber
          ls -lh models/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Python et FFmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests piper-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Vérifier les fichiers et les outils
        run: |
          pwd
          test -s scripts/balise_andran.py
          test -s models/model.onnx
          test -s models/model.onnx.json
          python -m piper --help
          ffmpeg -version

      - name: Générer le bulletin
        env:
          PYTHONUNBUFFERED: "1"
          PIPER_MODEL: ${{ github.workspace }}/models/model.onnx
          FFMPEG: ffmpeg
        run: python scripts/balise_andran.py

      - name: Vérifier le résultat
        run: |
          test -s BaliseAndran.mp3
          test -s phrase.txt
          test -s bulletin.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          meta = json.loads(Path("bulletin.json").read_text(encoding="utf-8"))
          audio = Path("BaliseAndran.mp3").read_bytes()
          assert meta["schema"] == 1
          assert meta["station_id"] == 2031
          assert isinstance(meta["valid"], bool)
          assert meta["mp3_bytes"] == len(audio)
          assert meta["mp3_sha256"] == hashlib.sha256(audio).hexdigest()
          print(json.dumps(meta, indent=2))
          PY
          ls -lh BaliseAndran.mp3 bulletin.json
          cat phrase.txt

      - name: Enregistrer le bulletin dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -- \
            BaliseAndran.mp3 \
            phrase.txt \
            bulletin.json \
            balise_andran.log
          if git diff --cached --quiet; then
            echo "Aucune modification du bulletin à enregistrer."
            exit 0
          fi
          git commit -m "Update bulletin"
          git status --short
          git pull --rebase --autostash origin main
          git push origin main
