name: Balise Andran

permissions:
  contents: write

on:

  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test
        run: |
          python --version
          date

      - name: Create file
        run: |
          echo "Balise Andran OK" > test.txt

            - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Test workflow" || exit 0

          git push
