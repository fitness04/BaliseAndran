name: Balise Andran

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create file
        run: |
          echo "Bonjour Balise Andran" > test.txt

      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add test.txt

          git commit -m "Test workflow" || exit 0

          git push
